name: Check Food Help
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: food-help-verification
          path: |
            playwright-report/
            artifacts/reports/
            artifacts/screenshots/
          retention-days: 7
